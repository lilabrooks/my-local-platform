# Pinning without update automation is just staleness with extra steps. This
# repo pins every image, action and module deliberately, so something has to
# propose the bumps -- otherwise pins rot silently, as they had by the time of
# the first audit (otel-collector was 22 minor versions behind).
#
# Grouped so a week produces a few reviewable PRs rather than a dozen.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/local"
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  # Multi-stage service images live outside the Compose directory. Without a
  # Docker ecosystem entry, the pinned Go builder tags never receive update
  # proposals. The final service stages use scratch and have no base to update.
  - package-ecosystem: docker
    directories:
      - "/services/echo"
      - "/services/relay"
      - "/services/sink"
    schedule:
      interval: weekly
    groups:
      service-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - "/infra/terraform/bootstrap"
      - "/infra/terraform/envs/dev"
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]

  # All five modules. This listed smoke, echo and validate only, so relay and
  # sink got no update PRs -- and relay is the module that has dependencies
  # worth updating: kafka-go, pgx and client_golang, plus sixteen indirect.
  # It was the only one of the five outside this list with a non-empty
  # require block, so the gap covered exactly the code it mattered for.
  #
  # sink and echo are standard-library-only and listing them changes nothing
  # today. They are here so the next dependency added to either does not
  # silently land outside the automation.
  #
  # Same undercount that hardcoded the CI build matrix to three modules (see
  # ci.yml), and quieter: a missing build fails, a missing update never
  # arrives.
  - package-ecosystem: gomod
    directories:
      - "/services/smoke"
      - "/services/echo"
      - "/services/relay"
      - "/services/sink"
      - "/k8s/validate"
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
