name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No AWS credentials are used anywhere in this workflow. Terraform runs with
# -backend=false and never plans against an account.
permissions:
  contents: read

jobs:
  go:
    name: go build and vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Kept in step with the modules that exist. This was hardcoded to
        # smoke/echo/validate, so services/relay and services/sink merged with
        # a green tick that built none of their code. scripts/lint.sh derives
        # its list from go.mod for the same reason; a matrix cannot, so adding a
        # module means adding it here -- and `discover` below fails the build if
        # anyone forgets.
        module: [services/smoke, services/echo, services/relay, services/sink, k8s/validate]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Without this, setup-go looks for go.sum at the repo root and warns
          # "Dependencies file is not found". go.mod is a valid cache key and
          # always exists -- services/echo has no go.sum, being stdlib-only.
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # go vet is a thin net; this adds errcheck, staticcheck, unused and
      # ineffassign. Config lives at the repo root.
      # action v9, not v6: v6 rejects golangci-lint v2 outright. The linter
      # version matches the one pinned locally so CI and `make lint` agree.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout 5m
      # -count=1: k8s/validate reads manifests the test cache does not track.
      - run: go test -count=1 ./...

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [infra/terraform/bootstrap, infra/terraform/envs/dev]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.stack }}

      # -backend=false: no state, no credentials, no network calls to AWS.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.stack }}

      - run: terraform validate
        working-directory: ${{ matrix.stack }}

  smoke:
    name: end-to-end smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/smoke/go.mod
          cache-dependency-path: services/smoke/go.sum

      # Order matters. relay-deliver joins a consumer group at startup, and a
      # group that joins before its topic exists is assigned no partitions.
      # relay sets WatchPartitionChanges so it recovers anyway, but starting
      # the infrastructure and its data before the services that consume them
      # is the honest ordering -- and it keeps this job from depending on that
      # recovery working.
      # The most registry-exposed job here: five third-party images plus the
      # golang base the relay and sink builds fetch. Pulled up front with the
      # same retry the image job uses, so a Docker Hub 5xx costs a sleep rather
      # than a red build and a human pressing re-run.
      #
      # --ignore-buildable skips the services compose builds from source; their
      # base images are read out of the Dockerfiles instead, so the version is
      # never written down twice.
      - name: Pull images, with retries
        run: |
          set -u
          images=$(awk '/^FROM/ && $2 != "scratch" {print $2}' services/*/Dockerfile | sort -u)
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::$1 failed (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return 1
          }
          for image in $images; do
            retry docker pull "$image" || { echo "could not pull $image" >&2; exit 1; }
          done
          retry docker compose -f local/docker-compose.yml \
            --profile core --profile messaging --profile apps \
            pull --ignore-buildable ||
            { echo "could not pull the compose images" >&2; exit 1; }

      - name: Start core and messaging
        run: |
          docker compose -f local/docker-compose.yml \
            --profile core --profile messaging up -d --wait --wait-timeout 300

      - name: Seed AWS resources, Kafka topics and relay subscriptions
        run: |
          ./local/bootstrap/seed.sh
          ./local/bootstrap/kafka-topics.sh
          ./local/bootstrap/relay-db.sh

      - name: Start relay and the sink
        run: |
          docker compose -f local/docker-compose.yml \
            --profile core --profile messaging --profile apps \
            up -d --build --wait --wait-timeout 600

      # The observability profile is deliberately left out: the smoke service
      # treats tracing as best effort, so its absence must not fail the run.
      # If this step fails, that contract is broken.
      - name: Run smoke checks
        working-directory: services/smoke
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: go run ./cmd/smoke

      # ADR 0006 chose Kafka over SNS-to-SQS because a queue cannot resend what
      # it has already acknowledged. That argument went unexercised through all
      # of M1; this is what stops it being a claim.
      - name: Verify replay redelivers acknowledged events
        run: ./scripts/verify-replay.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f local/docker-compose.yml --profile all logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f local/docker-compose.yml --profile all down -v

  image:
    name: build the ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      # Three independent images that cannot break each other. Without this, one
      # registry hiccup on any of them CANCELS the other two, so a single
      # transient fault is reported as three broken builds and hides whether the
      # other two would have passed. That happened on 2026-08-27.
      fail-fast: false
      matrix:
        service: [echo, relay, sink]
    steps:
      - uses: actions/checkout@v7

      # Docker Hub returned 500 from auth.docker.io here on 2026-08-27 and
      # failed the job; the same commit built clean on re-run, so the cost of a
      # registry blip is a human noticing and pressing a button.
      #
      # Retrying the PULL rather than `docker build` is deliberate. A blind
      # retry around the build would also retry genuine compile failures, three
      # times, turning a fast red into a slow one. These Dockerfiles fetch
      # exactly one image -- the build stage's base; the final stage is
      # `scratch`, which needs no pull -- so once it is local the build touches
      # no registry at all and can fail once, fast, on its own merits.
      #
      # The tag is read out of the Dockerfile rather than written here, because
      # a version pinned in two places drifts, and the failure mode would be
      # silent: this step would warm the wrong image and the build would pull
      # the right one with no retry, exactly when it matters.
      - name: pull base images, with retries
        run: |
          bases=$(awk '/^FROM/ && $2 != "scratch" {print $2}' \
            "services/${{ matrix.service }}/Dockerfile" | sort -u)
          [ -n "$bases" ] || { echo "no base image found in the Dockerfile" >&2; exit 1; }
          for base in $bases; do
            pulled=
            for attempt in 1 2 3; do
              if docker pull "$base"; then pulled=1; break; fi
              echo "::warning::pulling $base failed (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            [ -n "$pulled" ] || { echo "could not pull $base after 3 attempts" >&2; exit 1; }
          done

      - run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

  # The go matrix above cannot be computed from the repository -- GitHub needs
  # it before any step runs -- so this job checks it after the fact. It exists
  # because services/relay and services/sink were merged while the matrix still
  # listed three modules, and CI reported success over code it never built.
  go-modules-covered:
    name: every go module is in the build matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compare go.mod discovery against the matrix
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")
          found = sorted(
              str(p.parent).lstrip("./")
              for p in root.rglob("go.mod")
              if ".terraform" not in p.parts and "node_modules" not in p.parts
          )

          ci = pathlib.Path(".github/workflows/ci.yml").read_text()
          m = re.search(r"^\s*module: \[(.+?)\]\s*$", ci, re.M)
          if not m:
              sys.exit("could not find the go job's module matrix in ci.yml")
          listed = sorted(x.strip() for x in m.group(1).split(","))

          missing = [x for x in found if x not in listed]
          stale = [x for x in listed if x not in found]

          if missing:
              print("These modules have a go.mod but are NOT in the go job matrix.")
              print("CI would report success without building them:")
              for x in missing:
                  print("  " + x)
          if stale:
              print("These are in the matrix but have no go.mod:")
              for x in stale:
                  print("  " + x)
          if missing or stale:
              sys.exit(1)
          print("matrix covers every module: " + ", ".join(found))
          PY

  lint:
    name: linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, which needs more than the default shallow
          # clone of one commit.
          fetch-depth: 0

      # ONE implementation, not two.
      #
      # This job used to re-implement each of the ten linters that
      # scripts/lint.sh already runs, and every divergence between them cost a
      # red build that said nothing about the code:
      #
      #   - shellcheck was pinned in lint.sh and unpinned here, so the two ran
      #     different versions and disagreed about SC2015. `make lint` reported
      #     10/10 on the same commit this job failed.
      #   - yamllint had three paths and two versions; markdownlint had no
      #     pinned path at all.
      #   - tflint: lint.sh caches the plugin, leaves `--init` unsilenced with a
      #     comment explaining that hiding it once turned a GitHub 504 into an
      #     empty failure, and skips rather than fails when the download is the
      #     fault. This job's copy silenced `--init`, cached nothing, and
      #     handled nothing -- and produced exactly that empty failure.
      #
      # Every one of those was a lesson lint.sh had already learned and this
      # file had not, because they are two implementations of one thing. Running
      # the script is what stops a fourth.
      #
      # LINT_STRICT makes a skipped linter a failure: on a laptop a skip means a
      # missing tool, but here it would mean a gate silently did not run.
      # LINT_SKIP_OK declares the one intended exception -- golangci-lint runs in
      # the `go` job above, per module, through its own pinned action.
      - name: make lint
        env:
          LINT_STRICT: "1"
          LINT_SKIP_OK: golangci-lint
        run: make lint
