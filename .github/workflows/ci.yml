name: ci

on:
  pull_request:
  workflow_dispatch:

# `main` requires this workflow's aggregate check on an up-to-date pull
# request. Running the whole suite again after merge tests the same tree and
# roughly doubles the hosted work. CodeQL default setup still scans pushes to
# the protected branch.

# No AWS credentials are used anywhere in this workflow. Terraform runs with
# -backend=false and never plans against an account.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go build and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Kept in step with the modules that exist. This was hardcoded to
        # smoke/echo/validate, so services/relay and services/sink merged with
        # a green tick that built none of their code. scripts/lint.sh derives
        # its list from go.mod for the same reason; a matrix cannot, so adding a
        # module means adding it here -- and `discover` below fails the build if
        # anyone forgets.
        module: [services/smoke, services/echo, services/relay, services/sink, k8s/validate]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Without this, setup-go looks for go.sum at the repo root and warns
          # "Dependencies file is not found". go.mod is a valid cache key and
          # always exists -- services/echo has no go.sum, being stdlib-only.
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # Nothing else checks tidiness -- not scripts/lint.sh, not any other job.
      # `make tidy` covered services/smoke alone until #65, so four modules
      # could drift untidy indefinitely with every gate green. The Makefile
      # target now covers all five; this is the part that notices when someone
      # forgets to run it.
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::${{ matrix.module }} is not tidy. Run: make tidy"
            git diff -- go.mod go.sum
            exit 1
          fi

      # go vet is a thin net; this adds errcheck, staticcheck, unused and
      # ineffassign. Config lives at the repo root.
      # action v9, not v6: v6 rejects golangci-lint v2 outright. The linter
      # version matches the one pinned locally so CI and `make lint` agree.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout 5m
      # -count=1: k8s/validate reads manifests the test cache does not track.
      - run: go test -count=1 ./...

      - name: Kubernetes schema validation
        if: matrix.module == 'k8s/validate'
        working-directory: ${{ github.workspace }}
        run: ./scripts/validate-k8s-schema.sh

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        stack: [infra/terraform/bootstrap, infra/terraform/envs/dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.stack }}

      # -backend=false: no state, no credentials, no network calls to AWS.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.stack }}

      - run: terraform validate
        working-directory: ${{ matrix.stack }}

      - run: terraform test
        if: matrix.stack == 'infra/terraform/envs/dev'
        working-directory: ${{ matrix.stack }}

      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests
        if: matrix.stack == 'infra/terraform/envs/dev'

  smoke:
    name: end-to-end smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/smoke/go.mod
          cache-dependency-path: services/smoke/go.sum

      # Compose's default builder cache dies with the hosted runner. Bake uses
      # a container-backed BuildKit builder so the expensive Go build stages can
      # be restored from GitHub's cache on later runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The docker-container builder has its own image store, so a host-level
      # docker pull would not protect the build below. Warm the base in BuildKit
      # itself and retry only that fetch; compile failures still fail once.
      - name: Warm BuildKit base images, with retries
        run: |
          set -u
          bases=$(awk '/^FROM/ && $2 != "scratch" {print $2}' \
            services/relay/Dockerfile services/sink/Dockerfile | sort -u)
          [ -n "$bases" ] || { echo "no base image found in the Dockerfiles" >&2; exit 1; }
          for base in $bases; do
            warmed=
            for attempt in 1 2 3; do
              if printf 'FROM %s\n' "$base" | \
                docker buildx build --file - --output type=cacheonly services/relay; then
                warmed=1
                break
              fi
              echo "::warning::warming $base failed (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            [ -n "$warmed" ] || { echo "could not warm $base after 3 attempts" >&2; exit 1; }
          done

      # Order matters. relay-deliver joins a consumer group at startup, and a
      # group that joins before its topic exists is assigned no partitions.
      # relay sets WatchPartitionChanges so it recovers anyway, but starting
      # the infrastructure and its data before the services that consume them
      # is the honest ordering -- and it keeps this job from depending on that
      # recovery working.
      # The most registry-exposed job here: nine third-party runtime images.
      # Pull them up front with the same retry the image job uses, so a registry
      # 5xx costs a sleep rather than a red build and a human pressing re-run.
      # This includes the observability images even though those containers stay
      # stopped until after the no-collector smoke check. Downloading them here
      # keeps that contract while taking their pull off the later critical path.
      #
      # --ignore-buildable skips relay and sink. Bake builds those below and
      # restores their Go build stages from GitHub's cache when possible.
      - name: Pull images, with retries
        run: |
          set -u
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::$1 failed (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker compose --env-file .env.example -f local/docker-compose.yml \
            --profile core --profile messaging --profile apps --profile obs \
            pull --ignore-buildable ||
            { echo "could not pull the compose images" >&2; exit 1; }

      - name: Start core and messaging
        run: |
          docker compose --env-file .env.example -f local/docker-compose.yml \
            --profile core --profile messaging up -d --wait --wait-timeout 300

      - name: Seed AWS resources, Kafka topics and relay subscriptions
        run: make seed ENV_FILE=.env.example

      # relay-ingest and relay-deliver use the same relay:dev image, so building
      # relay-ingest is sufficient for both containers. Separate cache scopes
      # stop the relay and sink exports from replacing each other. Cache export
      # errors are non-fatal. The 2m setting shortens each cache request's 429
      # retry budget; it is not a wall-clock limit on this step.
      #
      # bake-action grants Buildx fs=* for local sources. The selected Compose
      # targets still limit the build contexts to services/relay and services/sink.
      - name: Build relay and sink with shared cache
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: ./local
          files: docker-compose.yml
          targets: relay-ingest,sink
          load: true
          set: |
            relay-ingest.cache-from=type=gha,scope=smoke-relay,timeout=2m
            relay-ingest.cache-to=type=gha,scope=smoke-relay,mode=max,ignore-error=true,timeout=2m
            sink.cache-from=type=gha,scope=smoke-sink,timeout=2m
            sink.cache-to=type=gha,scope=smoke-sink,mode=max,ignore-error=true,timeout=2m

      - name: Start relay and the sink
        run: |
          docker compose --env-file .env.example -f local/docker-compose.yml \
            --profile core --profile messaging --profile apps \
            up -d --no-build --wait --wait-timeout 600

      # The observability profile is deliberately left out: the smoke service
      # treats tracing as best effort, so its absence must not fail the run.
      # If this step fails, that contract is broken.
      #
      # MLP_SMOKE_REQUIRE_TRACES is spelled out rather than left to its default
      # so this step says what it is skipping. The next step is the one that
      # asserts the trace, with Tempo actually running.
      - name: Run smoke checks
        working-directory: services/smoke
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          MLP_SMOKE_REQUIRE_TRACES: "0"
        run: go run ./cmd/smoke

      # Issue #86's completion evidence: one event, one Tempo trace, holding the
      # ingest, produce, consume and per-attempt spans. It needs the collector
      # and Tempo, so it gets its own step with the obs profile up rather than
      # weakening the best-effort contract the step above proves. Relay was
      # started before the collector on purpose -- the OTLP exporter connects
      # lazily and retries, so an app that outlives a missing collector is part
      # of what this checks.
      - name: Start the observability stack
        run: |
          docker compose --env-file .env.example -f local/docker-compose.yml \
            --profile obs up -d --wait --wait-timeout 300

      - name: Verify one trace spans ingest, Kafka and every delivery attempt
        working-directory: services/smoke
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          MLP_SMOKE_REQUIRE_TRACES: "1"
        run: go run ./cmd/smoke

      # ADR 0006 chose Kafka over SNS-to-SQS because a queue cannot resend what
      # it has already acknowledged. That argument went unexercised through all
      # of M1; this is what stops it being a claim.
      - name: Verify replay redelivers acknowledged events
        run: ./scripts/verify-replay.sh

      # Target behaviour 3 in docs/goal-relay.md, and listed under "Still
      # planned" in ADR 0006 from the day that record was written. Steady state
      # only -- ordering across a rebalance needs a second consumer and is not
      # gated here. See issue #54.
      - name: Verify per-tenant delivery ordering
        run: ./scripts/verify-ordering.sh

      # relay-deliver has 60s of termination grace because SIGTERM stops fetches
      # and lets the current record finish under its 30s record deadline, then
      # runs four more bounded shutdown steps. This makes the relationship
      # behavioral rather than manifest arithmetic.
      - name: Verify graceful shutdown drains and commits the current record
        run: ./scripts/verify-graceful-drain.sh

      # ADR 0006's failure-semantics table states this as settled -- a consumer
      # dying after delivering but before committing produces a duplicate, not a
      # loss -- and listed it under "Still planned" from the day it was written.
      # It is also the half of the at-least-once contract you cannot check by
      # watching relay work. Runs last: it SIGKILLs the consumer.
      - name: Verify a crash redelivers rather than losing the event
        run: ./scripts/verify-duplicate-on-crash.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f local/docker-compose.yml --profile all logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example -f local/docker-compose.yml --profile all down -v

  image:
    name: build the ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Three independent images that cannot break each other. Without this, one
      # registry hiccup on any of them CANCELS the other two, so a single
      # transient fault is reported as three broken builds and hides whether the
      # other two would have passed. That happened on 2026-08-27.
      fail-fast: false
      matrix:
        service: [echo, relay, sink]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub returned 500 from auth.docker.io here on 2026-08-27 and
      # failed the job; the same commit built clean on re-run, so the cost of a
      # registry blip is a human noticing and pressing a button.
      #
      # Retrying the PULL rather than `docker build` is deliberate. A blind
      # retry around the build would also retry genuine compile failures, three
      # times, turning a fast red into a slow one. These Dockerfiles fetch
      # exactly one image -- the build stage's base; the final stage is
      # `scratch`, which needs no pull -- so once it is local the build touches
      # no registry at all and can fail once, fast, on its own merits.
      #
      # The tag is read out of the Dockerfile rather than written here, because
      # a version pinned in two places drifts, and the failure mode would be
      # silent: this step would warm the wrong image and the build would pull
      # the right one with no retry, exactly when it matters.
      - name: pull base images, with retries
        run: |
          bases=$(awk '/^FROM/ && $2 != "scratch" {print $2}' \
            "services/${{ matrix.service }}/Dockerfile" | sort -u)
          [ -n "$bases" ] || { echo "no base image found in the Dockerfile" >&2; exit 1; }
          for base in $bases; do
            pulled=
            for attempt in 1 2 3; do
              if docker pull "$base"; then pulled=1; break; fi
              echo "::warning::pulling $base failed (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            [ -n "$pulled" ] || { echo "could not pull $base after 3 attempts" >&2; exit 1; }
          done

      - run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

  # The go matrix above cannot be computed from the repository -- GitHub needs
  # it before any step runs -- so this job checks it after the fact. It exists
  # because services/relay and services/sink were merged while the matrix still
  # listed three modules, and CI reported success over code it never built.
  go-modules-covered:
    name: every go module is in the build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compare go.mod discovery against the matrix
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")
          found = sorted(
              str(p.parent).lstrip("./")
              for p in root.rglob("go.mod")
              if ".terraform" not in p.parts and "node_modules" not in p.parts
          )

          ci = pathlib.Path(".github/workflows/ci.yml").read_text()
          m = re.search(r"^\s*module: \[(.+?)\]\s*$", ci, re.M)
          if not m:
              sys.exit("could not find the go job's module matrix in ci.yml")
          listed = sorted(x.strip() for x in m.group(1).split(","))

          missing = [x for x in found if x not in listed]
          stale = [x for x in listed if x not in found]

          if missing:
              print("These modules have a go.mod but are NOT in the go job matrix.")
              print("CI would report success without building them:")
              for x in missing:
                  print("  " + x)
          if stale:
              print("These are in the matrix but have no go.mod:")
              for x in stale:
                  print("  " + x)
          if missing or stale:
              sys.exit(1)
          print("matrix covers every module: " + ", ".join(found))
          PY

  lint:
    name: linters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, which needs more than the default shallow
          # clone of one commit.
          fetch-depth: 0

      # ONE implementation, not two.
      #
      # This job used to re-implement each linter that
      # scripts/lint.sh already runs, and every divergence between them cost a
      # red build that said nothing about the code:
      #
      #   - shellcheck was pinned in lint.sh and unpinned here, so the two ran
      #     different versions and disagreed about SC2015. `make lint` reported
      #     10/10 on the same commit this job failed.
      #   - yamllint had three paths and two versions; markdownlint had no
      #     pinned path at all.
      #   - tflint: lint.sh caches the plugin, leaves `--init` unsilenced with a
      #     comment explaining that hiding it once turned a GitHub 504 into an
      #     empty failure, and skips rather than fails when the download is the
      #     fault. This job's copy silenced `--init`, cached nothing, and
      #     handled nothing -- and produced exactly that empty failure.
      #
      # Every one of those was a lesson lint.sh had already learned and this
      # file had not, because they are two implementations of one thing. Running
      # the script is what stops a fourth.
      #
      # LINT_STRICT makes a skipped linter a failure: on a laptop a skip means a
      # missing tool, but here it would mean a gate silently did not run.
      # LINT_SKIP_OK declares the one intended exception -- golangci-lint runs in
      # the `go` job above, per module, through its own pinned action.
      - name: make lint
        env:
          LINT_STRICT: "1"
          LINT_SKIP_OK: golangci-lint
        run: make lint

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  required:
    name: required checks
    if: always()
    needs:
      - go
      - terraform
      - smoke
      - image
      - go-modules-covered
      - lint
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify prerequisite results
        env:
          GO_RESULT: ${{ needs.go.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          MODULES_RESULT: ${{ needs.go-modules-covered.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          for result in \
            "$GO_RESULT" \
            "$TERRAFORM_RESULT" \
            "$SMOKE_RESULT" \
            "$IMAGE_RESULT" \
            "$MODULES_RESULT" \
            "$LINT_RESULT" \
            "$DEPENDENCY_REVIEW_RESULT"; do
            case "$result" in
              success | skipped) ;;
              *) echo "required job result: $result" >&2; exit 1 ;;
            esac
          done
