name: mlp-go-lint
services:
  lint:
    image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
    network_mode: bridge
    volumes:
      - ../..:/repo:ro
    command: ["golangci-lint", "run", "--config", "/repo/.golangci.yml", "--timeout", "5m"]
