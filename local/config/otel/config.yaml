# OpenTelemetry Collector -- local backends only.
#
# Services emit OTLP and know nothing about vendors. Where telemetry lands is
# decided here, never in application code.
#
# The `datadog` exporter is deliberately absent from this file rather than
# present-but-unused: the collector validates every DEFINED exporter at
# startup, so a datadog block with an empty api key crashes it even when no
# pipeline references it. Datadog lives in config.datadog.yaml instead.
# Switch with:  OTEL_COLLECTOR_CONFIG=config.datadog.yaml make up-obs

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
