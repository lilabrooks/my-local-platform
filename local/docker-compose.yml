# Local platform stack.
#
# Profiles let you bring up only what a given task needs. Memory IS a real
# constraint under sustained use, which an early measurement of this stack
# missed by sampling 46 seconds after startup:
#
#   profile      sustained
#   core             ~140 MB   floci + postgres
#   messaging        ~660 MB   kafka + rabbitmq
#   tools            ~285 MB   kafka-ui (optional; needs messaging)
#   obs              ~490 MB   collector + prometheus + tempo + grafana
#   apps              ~40 MB   relay ingest + deliver + sink (built from source)
#   ------------------------------------------------------------------
#   all            ~1,570 MB
#
# A local minikube (`make k8s-up`) adds ~1.8 GB on top, which makes it the
# single largest consumer -- `make k8s-down` when not doing GitOps work.
#
#   make up-core      floci (AWS surface) + postgres
#   make up-messaging + kafka, kafka-ui, rabbitmq
#   make up-obs       + otel-collector, prometheus, grafana, tempo
#   make up-apps      + relay and sink (needs core and messaging)
#   make up           everything
#
# Every image is pinned. Floating :latest tags are how local stacks rot.

name: mlp

services:
  # ---------------------------------------------------------------------------
  # AWS surface: S3, SNS, SQS, SES, IAM, Secrets Manager, DynamoDB, ...
  # floci emulates ~80 services on :4566 with no account or auth token.
  #
  # NO docker socket here, deliberately. Mounting /var/run/docker.sock grants
  # a container effective root on the host, and the services this repo uses
  # daily -- S3, SNS, SQS, SES, Secrets Manager -- do not need it. Verified by
  # running floci without it: all five work.
  #
  # floci's CONTAINER-BACKED services do need it, because they launch real
  # sibling containers: RDS, EKS, Lambda, MSK, ElastiCache, OpenSearch.
  # Without the socket those fail with a docker-java UnixSocket error.
  # Opt in for exactly as long as you need them:
  #
  #   docker compose -f local/docker-compose.yml \
  #                  -f local/docker-compose.floci-containers.yml \
  #                  --profile core up -d
  #
  # or `make up-core-containers`. See docs/adr/0002-floci-over-localstack.md.
  # ---------------------------------------------------------------------------
  # floci's entrypoint drops privileges to uid 1001 even when the container is
  # started as root, so a root-owned named volume makes persistent storage fail
  # at boot. Fix ownership once, before floci starts.
  floci-init:
    image: alpine:3.24
    container_name: mlp-floci-init
    profiles: [core, all]
    user: root
    command: ["sh", "-c", "mkdir -p /data && chown -R 1001:1001 /data"]
    volumes:
      - floci-data:/data

  floci:
    image: floci/floci:1.7.0
    container_name: mlp-floci
    profiles: [core, all]
    ports:
      - "4566:4566"
    environment:
      # Must match the service name so returned URLs (SQS queue URLs,
      # pre-signed S3 links) resolve from inside the compose network.
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      # Default storage is in-memory, so recreating the container silently
      # discards every seeded bucket, topic and queue. Persist to the volume.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
    volumes:
      - floci-data:/data
    user: root
    depends_on:
      floci-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Postgres. Stands in for RDS for day-to-day app work: same engine, no
  # control plane. floci's RDS is there when you want to learn the RDS *API*.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: mlp-postgres
    profiles: [core, all]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      # Postgres 18 changed the expected mount point. The image now puts data
      # in a major-version subdirectory (/var/lib/postgresql/18/docker) so that
      # `pg_upgrade --link` can work across versions without crossing a mount
      # boundary. Mounting the old /var/lib/postgresql/data path makes 18 exit 1
      # with "there appears to be PostgreSQL data in ... (unused mount/volume)".
      # See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Real Apache Kafka in KRaft mode (no ZooKeeper).
  # Deliberately NOT floci's MSK emulation, which is Redpanda underneath --
  # Kafka-compatible, but not the thing you said you wanted to learn.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: mlp-kafka
    profiles: [messaging, all]
    ports:
      - "9092:9092"    # from the host
      - "9094:9094"    # from inside minikube
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Three client listeners, because a Kafka client is told where to go next
      # rather than reusing the address it bootstrapped with. Whatever a
      # listener advertises has to resolve *from the client's own network*, so
      # each network that reaches this broker needs its own.
      #
      #   INTERNAL  kafka:19092                    other compose containers
      #   HOST      localhost:9092                 the laptop
      #   CLUSTER   host.minikube.internal:9094    pods in minikube
      #
      # Without CLUSTER, a pod bootstraps to the host fine and then fails on the
      # follow-up connection, because HOST advertises "localhost" and inside a
      # pod that is the pod. It looks like a broker fault and is not one.
      #
      # host.minikube.internal rather than the host's LAN address: minikube
      # provides it, and a hardcoded 192.168.x.y stops working the moment the
      # laptop joins a different network. It only resolves inside minikube,
      # which is correct -- this listener has exactly one audience.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092,CLUSTER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092,CLUSTER://host.minikube.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CLUSTER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: everything must be replication factor 1 or topics fail.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: mlp-local-cluster-0001
      # Without this the broker writes to its own default, /tmp/kraft-broker-logs
      # inside the container, and the kafka-data volume below is decorative --
      # mounted, empty, and doing nothing. Every container recreation then
      # destroys every topic and message, which was true here until 2026-08-25.
      #
      # It hides well: data survives `docker compose restart`, because the
      # container's writable layer survives. It only disappears when the
      # container is recreated, which is what a config change does.
      #
      # A log that does not outlive a config change cannot support replay, and
      # replay is the argument ADR 0006 rests on.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image default is -Xmx1G -Xms1G. -Xms PRE-COMMITS the heap, so the
      # broker trends to ~1GiB RSS no matter how little traffic it sees.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:19092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Own profile, not `messaging`: this is a 285 MB JVM UI, and the broker's
  # own CLI (docker exec mlp-kafka /opt/kafka/bin/...) covers most needs.
  #   docker compose --profile messaging --profile tools up -d
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: mlp-kafka-ui
    profiles: [tools, all]
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: mlp-rabbitmq
    profiles: [messaging, all]
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI -- guest/guest
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Observability. Services speak OTLP to the collector; the collector decides
  # where it goes. Datadog is one exporter among several, enabled by setting
  # DD_API_KEY. Nothing in the app code knows Datadog exists.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: mlp-otel-collector
    profiles: [obs, all]
    # Which config file is used decides whether Datadog receives telemetry.
    command: ["--config=/etc/otel/${OTEL_COLLECTOR_CONFIG:-config.yaml}"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # prometheus scrape endpoint
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
    volumes:
      - ./config/otel:/etc/otel:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: mlp-prometheus
    profiles: [obs, all]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  tempo:
    image: grafana/tempo:3.0.3
    container_name: mlp-tempo
    profiles: [obs, all]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # query API -- handy for `curl`ing traces directly
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.0
    container_name: mlp-grafana
    profiles: [obs, all]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # ---------------------------------------------------------------------------
  # relay -- the webhook delivery service, and the sink it delivers to.
  #
  # Two profiles each: `apps` to bring them up without the rest of the stack,
  # and `all` because `make up` has to start them -- smoke's relay check is
  # enabled whenever RELAY_INGEST_URL is set, and it defaults to
  # localhost:8082, so the documented `make up && make smoke` FAILS rather
  # than skips if relay is not running.
  #
  # Being built from source, they also need --build on any target that starts
  # them, or compose reuses the last image it built. Both `up` and `up-apps`
  # pass it. This comment used to say `make up` did not start them at all,
  # which was never true of `--profile all`.
  #
  #   docker compose --profile core --profile messaging --profile apps up -d
  #   make up-apps
  #
  # No container HEALTHCHECK on any of the three: they ship on scratch, which
  # has no shell to run one with. /healthz and /readyz exist for Kubernetes,
  # which probes over HTTP and needs nothing inside the image.
  # ---------------------------------------------------------------------------
  relay-ingest:
    build:
      context: ../services/relay
    image: relay:dev
    container_name: mlp-relay-ingest
    profiles: [apps, all]
    # relay treats a broker fetch failure as fatal and exits. That is a
    # reasonable stance for a consumer -- a restart rejoins the group cleanly --
    # but only if something restarts it. Kubernetes would; compose will not
    # unless told. Restarting Kafka killed this container twice while wiring
    # up #27.
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8082:8080"
    environment:
      RELAY_MODE: ingest
      # The internal listener: kafka advertises localhost:9092 to the host and
      # kafka:19092 inside this network. A container using the former resolves
      # to itself.
      KAFKA_BOOTSTRAP: kafka:19092
      RELAY_TOPIC: mlp.relay.deliveries
    depends_on:
      kafka:
        condition: service_healthy

  relay-deliver:
    build:
      context: ../services/relay
    image: relay:dev
    # No container_name, unlike every other service here. A fixed name makes
    # `docker compose up --scale relay-deliver=N` fail outright, and this is
    # the one service that has to run as more than one instance: it is a Kafka
    # consumer group, and group membership changing is the condition
    # scripts/verify-ordering-rebalance.sh exists to create. Nothing referred
    # to mlp-relay-deliver except this line.
    profiles: [apps, all]
    # relay treats a broker fetch failure as fatal and exits. That is a
    # reasonable stance for a consumer -- a restart rejoins the group cleanly --
    # but only if something restarts it. Kubernetes would; compose will not
    # unless told. Restarting Kafka killed this container twice while wiring
    # up #27.
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8083:8080"   # health only; a consumer has no inbound traffic
    environment:
      RELAY_MODE: deliver
      KAFKA_BOOTSTRAP: kafka:19092
      RELAY_TOPIC: mlp.relay.deliveries
      RELAY_DLQ_TOPIC: mlp.relay.deliveries.dlq
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      # Not the `demo` preset: that is 15s to reach the dead-letter queue,
      # which every `make smoke` run would then wait out. This is the same
      # shape, compressed, so the DLQ path is exercised in about a second.
      #
      # The `demo` preset is for the M2 minikube demo, where 15s of lag is the
      # point rather than the cost. Neither can be `standard` -- relay refuses
      # to start on a schedule it cannot outlive, see
      # docs/adr/0006-kafka-over-sqs-for-delivery.md.
      RELAY_RETRY_DELAYS: 200ms,400ms
      RELAY_DELIVERY_TIMEOUT: 2s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  sink:
    build:
      context: ../services/sink
    image: sink:dev
    container_name: mlp-sink
    profiles: [apps, all]
    # relay treats a broker fetch failure as fatal and exits. That is a
    # reasonable stance for a consumer -- a restart rejoins the group cleanly --
    # but only if something restarts it. Kubernetes would; compose will not
    # unless told. Restarting Kafka killed this container twice while wiring
    # up #27.
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # 8084 on the host, not 8081: `make argocd-ui` port-forwards the
      # ArgoCD UI to 8081, and the two collide when both are running.
      - "8084:8081"
    environment:
      # Must match what local/bootstrap/relay-db.sh wrote into the
      # subscriptions table, or every delivery is rejected 401. Both default to
      # the same local value; override both together to change it.
      RELAY_SIGNING_SECRET: ${RELAY_SIGNING_SECRET:-mlp-local-dev-signing-key}
      # /hooks/flaky always fails, so the dead-letter path is deterministic.
      SINK_FLAKY_FAIL_RATE: "1"

volumes:
  floci-data:
  # Renamed from pg-data at the Postgres 18 upgrade. The old volume holds a
  # 17-format cluster at its root, which 18 refuses to read at the new mount
  # point, so reusing the name would break `git pull && make up` with a wall of
  # text. A new name makes the upgrade a no-op; the old volume is orphaned and
  # safe to delete:  docker volume rm mlp_pg-data
  postgres-data:
  kafka-data:
  rabbit-data:
  prom-data:
  tempo-data:
  grafana-data:
