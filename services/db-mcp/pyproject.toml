[project]
name = "mlp-database-mcp"
version = "0.1.0"
description = "Local stdio access to approved database views and collections"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "pymysql[rsa]>=1.1,<2",
    "pymongo>=4.10,<5",
    "sqlglot>=30,<31",
]

[project.scripts]
mlp-db-mcp = "platform_db_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_db_mcp"]
