[[targets]]
name = "demo-postgres"
engine = "postgres"
environment = "local"
host = "127.0.0.1"
port = 58432
database = "meter_demo"
schema = "public"
username = "meter_reader"
password_file = "../../local/tmp/db-mcp/pg-reader"
tls = "local"
[targets.objects]
readings = ["sequence_no", "station", "state", "watts"]

