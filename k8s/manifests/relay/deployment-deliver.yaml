apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-deliver
  labels:
    app.kubernetes.io/name: relay-deliver
    app.kubernetes.io/component: deliver
    app.kubernetes.io/part-of: my-local-platform
spec:
  # No replicas field on purpose. KEDA owns this number (scaledobject.yaml), and
  # a value here would be a second authority: ArgoCD would restore it from git
  # every sync while KEDA re-scaled from lag, the two overwriting each other
  # every few seconds. The Application ignores /spec/replicas for this
  # Deployment so the git state stays silent about it.
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-deliver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-deliver
        app.kubernetes.io/component: deliver
        app.kubernetes.io/part-of: my-local-platform
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relay-deliver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: relay:dev
          # The tag exists in no registry; `make relay-image` loads it into the
          # cluster. Always would sit in ImagePullBackOff reaching for Docker Hub.
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAY_MODE
              value: deliver
          envFrom:
            - configMapRef:
                name: relay
            - secretRef:
                name: relay
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
      # On SIGTERM relay stops fetching and drains its current record for at
      # most DefaultStallBudget (30s), then runs four bounded cleanup steps in
      # order: an interrupted attempt's history write (5s), the health server's
      # shutdown (5s), the Kafka reader, DLQ writer and database pool closing
      # (5s shared), and the trace exporter's final flush (3s). 48s in total,
      # which is config.DeliverDrainBudget; k8s/validate asserts it against this
      # number, and also checks that the ConfigMap's 25s delivery schedule fits
      # inside the record deadline.
      #
      # The 12s above that budget is not decoration. It covers what relay cannot
      # put a deadline on -- process exit, container teardown -- and the closes
      # relay abandons rather than waits for when their shared budget runs out.
      terminationGracePeriodSeconds: 60
