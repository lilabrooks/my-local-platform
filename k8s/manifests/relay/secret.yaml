apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
  labels:
    app.kubernetes.io/part-of: my-local-platform
type: Opaque
stringData:
  # Local development values, not secrets -- the same ones local/docker-compose.yml
  # and local/bootstrap/relay-db.sh already use in plain text. They are here in a
  # Secret rather than the ConfigMap because that is where credentials belong,
  # and because M4 replaces this object with something backed by IRSA.
  #
  # The signing secret must match what the sink verifies with and what the
  # subscriptions table holds, or every delivery is rejected 401.
  DATABASE_URL: postgres://platform:platform@host.minikube.internal:5432/platform?sslmode=disable
  RELAY_SIGNING_SECRET: mlp-local-dev-signing-key
