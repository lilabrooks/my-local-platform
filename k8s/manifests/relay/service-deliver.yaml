apiVersion: v1
kind: Service
metadata:
  name: relay-deliver
  labels:
    app.kubernetes.io/name: relay-deliver
    app.kubernetes.io/part-of: my-local-platform
# The delivery consumer takes no inbound traffic; it pulls from Kafka. This
# Service exists for health endpoints and for Prometheus to scrape
# `/metrics` from every delivery pod.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relay-deliver
  ports:
    - name: http
      port: 80
      targetPort: http
