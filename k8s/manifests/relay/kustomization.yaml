apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlp

resources:
  - ../../base/relay
  - configmap.yaml
  - secret.yaml
  - scaledobject.yaml

images:
  - name: example.invalid/mlp-dev/relay
    newName: relay
    newTag: dev

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/managed-by: argocd
