apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-ingest
  labels:
    app.kubernetes.io/name: relay-ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: my-local-platform
spec:
  # Two replicas: ingest is stateless HTTP and a rolling update should not
  # drop events on the floor.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-ingest
        app.kubernetes.io/component: ingest
        app.kubernetes.io/part-of: my-local-platform
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relay-ingest
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: relay:dev
          # The tag exists in no registry; `make relay-image` loads it into the
          # cluster. Always would sit in ImagePullBackOff reaching for Docker Hub.
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAY_MODE
              value: ingest
          envFrom:
            - configMapRef:
                name: relay
            - secretRef:
                name: relay
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
      # Ingest has no record deadline: it fails readiness, keeps serving for
      # IngestReadinessGrace (3s) so load balancers notice, waits out in-flight
      # requests (20s), closes the Kafka writer and pool (5s shared), and
      # flushes traces (3s). 31s in total, which is config.IngestDrainBudget and
      # what k8s/validate asserts against this number. The rest is slack for
      # process exit and container teardown.
      #
      # The 20s is not arbitrary: postEvent detaches from the request context
      # and keeps 15s to finish persisting and publishing, so a shutdown that
      # stopped waiting sooner would close the pool under the handler that
      # detachment exists to protect.
      terminationGracePeriodSeconds: 45
