apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlp

resources:
  - deployment.yaml
  - service.yaml

# 'commonLabels' is deprecated in kustomize; 'labels' with includeSelectors
# false adds the label without rewriting the Deployment's selector, which is
# immutable once created.
labels:
  - includeSelectors: false   # the Deployment selector is immutable once created
    includeTemplates: true    # but pods should still carry the label
    pairs:
      app.kubernetes.io/managed-by: argocd
