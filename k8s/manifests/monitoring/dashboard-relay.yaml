          {
            "id": 6,
            "type": "timeseries",
            "title": "Ingest",
            "description": "Events arriving at POST /v1/events. \"unavailable\" means the broker refused the write and the caller got a 503, which is the one outcome that must never be reported as success.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 16,
              "y": 19
