          {
            "id": 4,
            "type": "timeseries",
            "title": "Delivery attempts by status class",
            "description": "Individual HTTP requests, retries included. \"error\" is no response at all -- refused, unresolvable or timed out -- which is a different fault from a subscriber answering 5xx.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 0,
              "y": 19
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                },
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "sum by (status_class) (rate(relay_delivery_attempts_total[1m]))",
                "legendFormat": "{{status_class}}",
                "refId": "A",
                "range": true
              }
            ]
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "Terminal outcomes",
            "description": "Per-subscriber deliveries that finished, one way or the other. A record is committed only once every subscriber reaches one of these, so this is also what the committed offset is waiting on.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 8,
              "y": 19
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                },
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
