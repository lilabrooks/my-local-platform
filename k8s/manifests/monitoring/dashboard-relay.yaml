      {
        "uid": "relay-delivery",
        "title": "relay: delivery and consumer lag",
        "description": "Provisioned from local/config/grafana/provisioning/dashboards/relay.json. Edits made in this UI are discarded on restart; change the file instead.",
        "tags": [
          "relay",
          "kafka",
          "m2"
