          {
            "id": 4,
            "type": "timeseries",
            "title": "Delivery attempts by status class",
            "description": "Individual HTTP requests, retries included. \"error\" is no response at all -- refused, unresolvable or timed out -- which is a different fault from a subscriber answering 5xx.",
