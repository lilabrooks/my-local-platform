                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                },
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
