        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "Consumer lag, processes, and group assignment",
            "description": "The demo, on one graph. Slowing the sink raises its latency; lag climbs behind it; KEDA adds consumers; lag drains; the consumers go away again. relay-ingest reads lag, group membership, and partition assignments from the broker in one poll. The process count comes from scraped relay-deliver instances. It can briefly lead or trail broker membership while scaling because Prometheus scrapes and broker polls run on separate intervals; a sustained gap after both settle points to a process that has not joined. Unassigned members hold zero partitions. Unassigned partitions have no owner and cannot drain.\n\nIf a partition or group cannot be read, or the group is rebalancing, relay leaves the last complete values in place. Check relay_lag_partitions_missing and relay_lag_refreshed_timestamp_seconds before trusting a flat line. max() keeps the 2 relay-ingest replicas from multiplying the broker-wide values.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                }
              },
              "overrides": [
                {
                  "matcher": {
                    "id": "byRegexp",
                    "options": "/(deliver instances|group members|unassigned members|unassigned partitions)/"
                  },
                  "properties": [
                    {
                      "id": "custom.axisPlacement",
                      "value": "right"
                    },
                    {
                      "id": "custom.drawStyle",
                      "value": "line"
                    },
                    {
                      "id": "custom.lineInterpolation",
                      "value": "stepAfter"
                    },
                    {
                      "id": "custom.lineWidth",
                      "value": 3
                    },
                    {
                      "id": "custom.fillOpacity",
                      "value": 0
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "fixed",
                        "fixedColor": "orange"
                      }
                    },
                    {
                      "id": "custom.axisLabel",
                      "value": "instances / members / partitions / ms"
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "sink latency (ms)"
                  },
                  "properties": [
                    {
                      "id": "custom.axisPlacement",
                      "value": "right"
                    },
                    {
                      "id": "custom.fillOpacity",
