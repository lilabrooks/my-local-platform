              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "max(sink_latency_ms)",
                "legendFormat": "sink latency (ms)",
                "refId": "C",
                "range": true
              }
            ]
          },
          {
            "id": 2,
            "type": "timeseries",
            "title": "Lag by partition",
            "description": "Twelve partitions is the ceiling on useful consumers, so this is where a scale-up that cannot help shows itself: lag concentrated on one partition drains at one consumer's pace however many pods exist. Events keyed by tenant is what puts it there.\n\nAggregated with max by (partition) for the same reason as the panel above -- without it each partition is drawn once per ingest replica.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 0,
              "y": 10
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "max by (partition) (relay_consumer_group_lag{group=\"relay-deliver\"})",
                "legendFormat": "partition {{partition}}",
                "refId": "A",
                "range": true
              }
            ]
          },
          {
            "id": 3,
            "type": "timeseries",
            "title": "Delivery attempt latency",
            "description": "One HTTP POST to one subscriber. This is the cause and the lag above is the effect. Watch it against RELAY_DELIVERY_TIMEOUT: attempts pressed up against the timeout are failing and retrying, which collapses throughput rather than merely slowing it -- the mistake recorded in docs/runbook-k8s.md.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 12,
              "y": 10
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                },
                "unit": "s"
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "histogram_quantile(0.5, sum by (le) (rate(relay_delivery_attempt_duration_seconds_bucket[1m])))",
                "legendFormat": "p50",
                "refId": "A",
                "range": true
              },
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "histogram_quantile(0.95, sum by (le) (rate(relay_delivery_attempt_duration_seconds_bucket[1m])))",
                "legendFormat": "p95",
                "refId": "B",
                "range": true
              },
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "histogram_quantile(0.99, sum by (le) (rate(relay_delivery_attempt_duration_seconds_bucket[1m])))",
                "legendFormat": "p99",
                "refId": "C",
                "range": true
              },
