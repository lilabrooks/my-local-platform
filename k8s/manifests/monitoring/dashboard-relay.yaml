                "legendFormat": "age",
                "refId": "A",
                "range": true
              }
            ]
          },
          {
            "id": 8,
            "type": "timeseries",
            "title": "Records completed by partition",
            "description": "Counted after the commit, so this is work finished rather than work started. As KEDA adds consumers the partitions spread across them, which is the throughput increase the lag panel shows as a falling line.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 5,
              "w": 16,
              "x": 8,
              "y": 27
            },
            "fieldConfig": {
              "defaults": {
