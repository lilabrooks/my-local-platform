data:
  relay.json: |
      {
        "uid": "relay-delivery",
        "title": "relay: delivery and consumer lag",
        "description": "Provisioned from local/config/grafana/provisioning/dashboards/relay.json. Edits made in this UI are discarded on restart; change the file instead.",
        "tags": [
          "relay",
          "kafka",
          "m2"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "editable": false,
        "refresh": "5s",
        "time": {
          "from": "now-15m",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "Consumer lag and consumer count",
            "description": "The demo, on one graph. Slowing the sink raises its latency; lag climbs behind it; KEDA adds consumers; lag drains; the consumers go away again. Lag is read from the broker by relay-ingest, which is where KEDA reads it too, so the scaler and this panel cannot disagree.\n\nmax() rather than sum(): every relay-ingest replica polls the broker for the same consumer group and reports the same number, so summing multiplies lag by the ingest replica count. max() is the truth whatever that count is.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never",
                  "spanNulls": true,
                  "axisPlacement": "auto"
                },
                "color": {
                  "mode": "palette-classic"
                }
              },
              "overrides": [
                {
                  "matcher": {
                    "id": "byName",
                    "options": "deliver instances"
                  },
                  "properties": [
                    {
                      "id": "custom.axisPlacement",
                      "value": "right"
                    },
                    {
                      "id": "custom.drawStyle",
                      "value": "line"
                    },
                    {
                      "id": "custom.lineInterpolation",
                      "value": "stepAfter"
                    },
                    {
                      "id": "custom.lineWidth",
                      "value": 3
                    },
                    {
                      "id": "custom.fillOpacity",
                      "value": 0
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "fixed",
                        "fixedColor": "orange"
                      }
                    },
                    {
                      "id": "custom.axisLabel",
                      "value": "instances / ms"
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "sink latency (ms)"
                  },
                  "properties": [
                    {
                      "id": "custom.axisPlacement",
                      "value": "right"
                    },
                    {
                      "id": "custom.fillOpacity",
                      "value": 0
                    },
                    {
                      "id": "custom.lineStyle",
                      "value": {
                        "fill": "dash",
                        "dash": [
                          8,
                          8
                        ]
                      }
                    },
                    {
                      "id": "color",
                      "value": {
                        "mode": "fixed",
                        "fixedColor": "text"
                      }
                    }
                  ]
                },
                {
                  "matcher": {
                    "id": "byName",
                    "options": "lag (records)"
                  },
                  "properties": [
                    {
                      "id": "custom.axisLabel",
                      "value": "records"
                    },
                    {
                      "id": "custom.fillOpacity",
                      "value": 20
                    }
                  ]
                }
              ]
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "max",
                  "lastNotNull"
