              ]
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "max",
                  "lastNotNull"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "max(relay_consumer_group_lag_total{group=\"relay-deliver\"})",
                "legendFormat": "lag (records)",
                "refId": "A",
                "range": true
