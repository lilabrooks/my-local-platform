                "expr": "sum by (outcome) (rate(relay_ingest_events_total[1m]))",
                "legendFormat": "{{outcome}}",
                "refId": "A",
                "range": true
              }
            ]
          },
          {
            "id": 7,
            "type": "stat",
            "title": "Age of the lag measurement",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "description": "Seconds since relay-ingest last read lag from the broker. The gauges above hold their last value when a poll fails, so a lag of zero and a lag nobody could measure look identical on a graph. This is how they are told apart.\n\nHealthy is under about 20s and not under 5: the age is a 5s poll interval plus however long ago Prometheus scraped it, up to another 15s. Thresholds sit above that sum, or this would sit amber while everything was fine.",
            "gridPos": {
              "h": 5,
              "w": 8,
              "x": 0,
              "y": 27
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 30
                    },
                    {
                      "color": "red",
                      "value": 90
                    }
                  ]
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
