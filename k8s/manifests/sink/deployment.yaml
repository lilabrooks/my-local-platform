apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  labels:
    app.kubernetes.io/name: sink
    app.kubernetes.io/part-of: my-local-platform
spec:
  # One replica on purpose. The sink keeps what it received in memory, so a
  # second replica would answer /received with half the story and the demo's
  # assertions would flake.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sink
        app.kubernetes.io/part-of: my-local-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: sink:dev
          imagePullPolicy: IfNotPresent
          env:
            # Must match what relay signs with and what the subscriptions table
            # holds. Same Secret, so they cannot drift apart.
            - name: RELAY_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay
                  key: RELAY_SIGNING_SECRET
            # /hooks/flaky always fails, so the dead-letter path is deterministic.
            - name: SINK_FLAKY_FAIL_RATE
              value: "1"
            - name: PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              # SINK_RETAIN bounds what the sink holds (#23); this is the
              # backstop if that is ever set too high. 10000 deliveries is
              # ~1.8MB, so the headroom here is deliberate rather than tight.
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
      terminationGracePeriodSeconds: 20
