apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlp

resources:
  - ../../base/sink

images:
  - name: example.invalid/mlp-dev/sink
    newName: sink
    newTag: dev

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/managed-by: argocd
