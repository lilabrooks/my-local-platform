# App-of-apps. This single Application watches k8s/apps/, so adding an
# Application manifest there registers a new app with no further kubectl.
#
# This file is NOT self-managed: the root app's source path is k8s/apps, which
# does not include this file. Changing it means re-running install.sh.
#
# The __REPO_URL__ placeholder works here because install.sh substitutes it at
# apply time. It would NOT work in k8s/apps/, which ArgoCD reads from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Without this, deleting the root app orphans every child app.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlp-root

  source:
    repoURL: __REPO_URL__
    targetRevision: main
    path: k8s/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true      # remove resources whose manifests were deleted
      selfHeal: true   # revert manual kubectl edits back to git
