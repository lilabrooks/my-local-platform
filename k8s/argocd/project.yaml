# Workload Applications use this project. The separate mlp-root project creates
# those Applications, while the default project is disabled.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlp
  namespace: argocd
spec:
  description: my-local-platform workloads

  sourceRepos:
    - __REPO_URL__

  destinations:
    - server: https://kubernetes.default.svc
      namespace: mlp

  # CreateNamespace=true needs this permission. Restrict the cluster-scoped
  # resource by name so a workload cannot create another namespace.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: mlp

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
