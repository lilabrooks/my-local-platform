# Shape only. #96 streams the real values from Secrets Manager to kubectl and
# must never write the populated object to disk or git.
apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
  namespace: mlp
  labels:
    app.kubernetes.io/part-of: my-local-platform
type: Opaque
stringData:
  DATABASE_URL: __RDS_DATABASE_URL__
  RELAY_SIGNING_SECRET: __SINK_SIGNING_SECRET__
