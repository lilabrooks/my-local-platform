apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlp

resources:
  - ../../base/sink
  - serviceaccount.yaml

patches:
  - target:
      kind: Deployment
      name: sink
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: sink

# The base carries a non-routable digest fixture. The generated AWS root
# Application replaces it with the approved sink digest from ECR.

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/managed-by: argocd
