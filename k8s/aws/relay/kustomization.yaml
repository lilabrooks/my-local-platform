apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlp

resources:
  - ../../base/relay
  - serviceaccounts.yaml
  - scaledobject.yaml

patches:
  - target:
      kind: Deployment
      name: relay-ingest
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: relay-ingest
  - target:
      kind: Deployment
      name: relay-deliver
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: relay-deliver

# This fixture makes a direct offline render immutable. The generated AWS root
# Application replaces it with the approved relay digest from ECR.

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/managed-by: argocd
