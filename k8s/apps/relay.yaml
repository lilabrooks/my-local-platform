apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlp

  source:
    # A REAL url, not the __REPO_URL__ placeholder used in k8s/argocd/.
    # ArgoCD reads this file straight from git, where nothing substitutes
    # anything -- a placeholder here syncs literally and the app fails with
    # "application repo __REPO_URL__ is not permitted in project 'mlp'".
    repoURL: git@github.com:lilabrooks/my-local-platform.git
    targetRevision: main
    path: k8s/manifests/relay

  destination:
    server: https://kubernetes.default.svc
    namespace: mlp

  # KEDA scales relay-deliver, so its replica count is not drift. Without this,
  # selfHeal would restore the git value on every sync while KEDA re-scaled
  # from lag -- the two overwriting each other every few seconds, and a demo
  # that flaps instead of scaling.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: relay-deliver
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
