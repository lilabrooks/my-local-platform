apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlp
  source:
    repoURL: https://github.com/lilabrooks/my-local-platform.git
    # The generated root Application replaces this with the approved full SHA.
    targetRevision: __GIT_COMMIT__
    path: k8s/aws/relay
  destination:
    server: https://kubernetes.default.svc
    namespace: mlp
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: relay-deliver
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
