apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlp

  source:
    # A REAL url, not the __REPO_URL__ placeholder used in k8s/argocd/.
    # Those files are applied by install.sh, which substitutes as it applies.
    # This file is read by ArgoCD straight from git, where nothing substitutes
    # anything -- a placeholder here syncs literally and the app fails with
    # "application repo __REPO_URL__ is not permitted in project 'mlp'".
    #
    # Forking? Change this line, and pass REPO_URL to install.sh.
    repoURL: git@github.com:lilabrooks/my-local-platform.git
    targetRevision: main
    path: k8s/manifests/echo

  destination:
    server: https://kubernetes.default.svc
    namespace: mlp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
